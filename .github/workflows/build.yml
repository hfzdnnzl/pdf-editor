name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Needed to attach the installers to the GitHub release created for `v*` tags.
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            artifact: macos
          - os: windows-latest
            target: win
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installers
        shell: bash
        # electron-builder treats a defined-but-empty CSC_LINK as a certificate path and fails with
        # "<repo> not a file", so empty signing variables must be unset before packaging. Signing is
        # enabled automatically once the matching repository secrets exist.
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK
          [ -n "$CSC_KEY_PASSWORD" ] || unset CSC_KEY_PASSWORD
          [ -n "$APPLE_ID" ] || unset APPLE_ID
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || unset APPLE_APP_SPECIFIC_PASSWORD
          [ -n "$APPLE_TEAM_ID" ] || unset APPLE_TEAM_ID
          npx electron-builder --${{ matrix.target }} --publish never
        env:
          # Optional: set these repository secrets to produce signed builds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
      - name: Attach installers to the GitHub release
        # Only on `v*` tags (e.g. `git tag v1.0.0 && git push origin v1.0.0`). Both matrix jobs
        # write to the same release; the action creates it on first use and updates it afterwards.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Studio ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Each runner only has its own platform's files, so the globs are a no-op elsewhere.
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
